<title>PicBear before / after</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

</head><body><div id="pbx-host">
<!-- ==========================================================================
     PicBear · before / after viewer — OptiMonk HTML element
     Scoped to #pbx, all classes namespaced pbx-*.
     Autoplay build: the slider sweeps on its own; drag takes over, autoplay resumes after a pause.

     1. Upload the sample images somewhere that serves direct image URLs.
     2. Put the URLs in PBX.data below (or set base + relative paths).
     3. Paste this whole block into an HTML element in the campaign editor.
     ========================================================================== -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<div id="pbx" class="pbx">

  <div class="pbx-viewer">
    <div class="pbx-stage">
      <div class="pbx-shade" aria-hidden="true"></div>

      <div class="pbx-plate pbx-plate-a"><img alt="Original product photo" draggable="false"></div>
      <div class="pbx-plate pbx-plate-b"><img alt="PicBear generated image" draggable="false"></div>

      <span class="pbx-mark pbx-mark-a">Original</span>
      <span class="pbx-mark pbx-mark-b">PicBear</span>

      <div class="pbx-seam" aria-hidden="true"></div>
      <button type="button" class="pbx-grip" role="slider"
              aria-label="Drag to compare the original photo with the PicBear image"
              aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i></i></button>

      <span class="pbx-hint">Drag to compare</span>
      <div class="pbx-veil" hidden></div>

      <div class="pbx-blank" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <rect x="2.5" y="6" width="19" height="14" rx="3"/><circle cx="12" cy="13" r="4"/><path d="M8.5 6 10 3.5h4L15.5 6"/>
        </svg>
        <b></b><p></p>
      </div>
    </div>

    <div class="pbx-tray">
      <div class="pbx-cats" role="group" aria-label="Product category"></div>
      <div class="pbx-styles" role="tablist" aria-label="Image style"><span class="pbx-rule" aria-hidden="true"></span></div>
    </div>
  </div>

  <p class="pbx-cap"></p>
</div>

<style>
#pbx, #pbx *{box-sizing:border-box}
#pbx{
  --pbx-body:#1A1614;
  --pbx-tray:#221D1A;
  --pbx-warm:#F5EFE7;
  --pbx-dim:#A0938A;
  --pbx-edge:rgba(245,239,231,.13);
  --pbx-flare:#ED5A29;
  --pbx-cap:#6E6157;
  --s:100%;
  --pbx-h:520px;                  /* total height of the whole component */
  font-family:"Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.4; text-align:left;
  max-width:520px; margin:0 auto;
  display:flex; flex-direction:column;
  height:var(--pbx-h); max-height:var(--pbx-h);
  -webkit-font-smoothing:antialiased;
}

/* ------------------------------------------------------------------ shell */
#pbx .pbx-viewer{
  flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
  background:var(--pbx-body); border-radius:18px; overflow:hidden;
  box-shadow:0 1px 2px rgba(26,22,20,.16), 0 18px 40px -18px rgba(26,22,20,.55);
}

/* ------------------------------------------------------------------ stage */
#pbx .pbx-stage{
  position:relative; width:100%; flex:1 1 auto; min-height:150px; overflow:hidden;
  background:var(--pbx-body); touch-action:pan-y;
  cursor:col-resize; user-select:none; -webkit-user-select:none; contain:paint;
}
#pbx .pbx-plate{position:absolute; inset:0}
#pbx .pbx-plate img{
  width:100%; height:100%; display:block; object-fit:cover;
  pointer-events:none; -webkit-user-drag:none;
  opacity:1; transition:opacity .26s ease;
}
#pbx .pbx-plate img.pbx-whole{object-fit:contain}
#pbx .pbx-plate-b{clip-path:inset(0 0 0 var(--s)); will-change:clip-path}
#pbx.pbx-turning .pbx-plate img{opacity:0}

/* vignette keeps the labels legible over any photograph */
#pbx .pbx-shade{
  position:absolute; inset:0; z-index:2; pointer-events:none;
  background:linear-gradient(to top, rgba(20,16,14,.42) 0%, rgba(20,16,14,.10) 22%, rgba(20,16,14,0) 46%);
}

#pbx .pbx-mark{
  position:absolute; bottom:13px; z-index:4; pointer-events:none;
  font-size:11.5px; font-weight:500; letter-spacing:.01em; color:var(--pbx-warm);
  text-shadow:0 1px 6px rgba(20,16,14,.7);
  transition:opacity .22s ease;
}
#pbx .pbx-mark-a{left:15px}
#pbx .pbx-mark-b{right:15px; font-weight:600}
#pbx.pbx-holding .pbx-mark{opacity:.3}

/* the seam: white hairline that survives both light and dark photography */
#pbx .pbx-seam{
  position:absolute; top:0; bottom:0; left:var(--s); width:1.5px; margin-left:-.75px; z-index:5;
  background:var(--pbx-warm); box-shadow:0 0 0 .5px rgba(20,16,14,.45); pointer-events:none;
}
#pbx .pbx-grip{
  position:absolute; top:50%; left:var(--s); z-index:6;
  width:40px; height:64px; margin:-32px 0 0 -20px; padding:0;
  border:0; background:transparent; cursor:grab; display:grid; place-items:center;
}
#pbx .pbx-grip i{
  display:block; width:7px; height:46px; border-radius:4px; background:var(--pbx-warm);
  box-shadow:0 0 0 .5px rgba(20,16,14,.4), 0 3px 12px rgba(20,16,14,.45);
  position:relative; transition:transform .2s cubic-bezier(.2,.9,.3,1), height .2s ease;
}
#pbx .pbx-grip i::before, #pbx .pbx-grip i::after{
  content:""; position:absolute; left:2px; right:2px; height:1px; background:rgba(26,22,20,.28);
}
#pbx .pbx-grip i::before{top:19px} #pbx .pbx-grip i::after{bottom:19px}
#pbx .pbx-stage:hover .pbx-grip i{transform:scaleY(1.06)}
#pbx.pbx-holding .pbx-grip{cursor:grabbing}
#pbx.pbx-holding .pbx-grip i{transform:scaleX(1.25) scaleY(1.1)}

#pbx .pbx-hint{
  position:absolute; left:50%; bottom:13px; transform:translateX(-50%); z-index:4;
  font-size:11px; font-weight:500; color:var(--pbx-warm); opacity:.72;
  text-shadow:0 1px 6px rgba(20,16,14,.7); pointer-events:none;
  transition:opacity .3s ease;
}
#pbx.pbx-touched .pbx-hint{opacity:0}

/* loading shimmer, on the console surface rather than a spinner */
#pbx .pbx-veil{position:absolute; inset:0; z-index:7; background:var(--pbx-body); overflow:hidden}
#pbx .pbx-veil[hidden]{display:none}
#pbx .pbx-veil::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(105deg, transparent 30%, rgba(245,239,231,.07) 50%, transparent 70%);
  animation:pbx-sheen 1.1s linear infinite;
}
@keyframes pbx-sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

#pbx .pbx-blank{
  position:absolute; inset:0; z-index:8; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px; text-align:center; padding:30px;
  background:var(--pbx-body);
}
#pbx .pbx-blank[hidden]{display:none}
#pbx .pbx-blank svg{width:26px; height:26px; color:var(--pbx-dim); opacity:.8}
#pbx .pbx-blank b{font-size:15px; font-weight:600; color:var(--pbx-warm); letter-spacing:-.01em}
#pbx .pbx-blank p{margin:0; font-size:12.5px; color:var(--pbx-dim); max-width:34ch; line-height:1.5}

/* ------------------------------------------------------------------- tray */
#pbx .pbx-tray{flex:0 0 auto; padding:12px 14px 3px; border-top:1px solid var(--pbx-edge)}

#pbx .pbx-cats{
  display:flex; gap:5px; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none;
  padding-bottom:2px; -webkit-overflow-scrolling:touch;
}
#pbx .pbx-cats::-webkit-scrollbar{display:none}
#pbx .pbx-cat{
  flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; line-height:1;
  padding:7px 11px 7px 9px; font:inherit; font-size:12px; font-weight:500;
  color:var(--pbx-dim); background:transparent;
  border:1px solid var(--pbx-edge); border-radius:999px; cursor:pointer; white-space:nowrap;
  transition:color .16s ease, border-color .16s ease, background .16s ease;
}
#pbx .pbx-cat:hover{color:var(--pbx-warm); border-color:rgba(245,239,231,.3)}
#pbx .pbx-cat svg{width:13px; height:13px; flex:none}
#pbx .pbx-cat[aria-pressed="true"]{
  background:var(--pbx-warm); border-color:var(--pbx-warm); color:#1A1614; font-weight:600;
}

#pbx .pbx-styles{position:relative; display:flex; gap:2px; margin-top:11px}
#pbx .pbx-style{
  flex:0 1 auto; font:inherit; font-size:13px; font-weight:500; line-height:1;
  padding:10px 12px 13px; border:0; background:transparent; color:var(--pbx-dim);
  cursor:pointer; white-space:nowrap; transition:color .18s ease;
}
#pbx .pbx-style:hover{color:var(--pbx-warm)}
#pbx .pbx-style[aria-selected="true"]{color:var(--pbx-warm); font-weight:600}
#pbx .pbx-rule{
  position:absolute; bottom:3px; left:0; height:2px; width:0; border-radius:2px;
  background:var(--pbx-flare);
  transition:transform .32s cubic-bezier(.22,.85,.3,1), width .32s cubic-bezier(.22,.85,.3,1);
}

#pbx .pbx-cat:focus-visible, #pbx .pbx-style:focus-visible, #pbx .pbx-grip:focus-visible{
  outline:2px solid var(--pbx-flare); outline-offset:2px; border-radius:6px;
}

#pbx .pbx-cap{flex:0 0 auto; margin:10px 2px 0; font-size:11.5px; line-height:1.45; color:var(--pbx-cap)}
#pbx .pbx-cap:empty{display:none}

/* the split animates only when moved by the widget, never under a finger */
#pbx.pbx-glide .pbx-plate-b, #pbx.pbx-glide .pbx-seam, #pbx.pbx-glide .pbx-grip{
  transition:clip-path .3s cubic-bezier(.22,.85,.3,1), left .3s cubic-bezier(.22,.85,.3,1);
}

@media (max-width:430px){
  #pbx{--pbx-h:445px}
  #pbx .pbx-style{font-size:12px; padding:10px 8px 13px}
  #pbx .pbx-tray{padding:10px 11px 3px}
}
@media (max-height:560px){ #pbx{--pbx-h:100%} }
@media (prefers-reduced-motion:reduce){
  #pbx *, #pbx *::after{transition:none!important; animation:none!important}
}
</style>

  function init(){
    var root = document.getElementById('pbx');
    if(!root || root.dataset.pbxReady === '1') return;
    root.dataset.pbxReady = '1';

    var stage  = root.querySelector('.pbx-stage'),
        imgA   = root.querySelector('.pbx-plate-a img'),
        imgB   = root.querySelector('.pbx-plate-b img'),
        grip   = root.querySelector('.pbx-grip'),
        cats   = root.querySelector('.pbx-cats'),
        styles = root.querySelector('.pbx-styles'),
        rule   = root.querySelector('.pbx-rule'),
        veil   = root.querySelector('.pbx-veil'),
        blank  = root.querySelector('.pbx-blank'),
        blankT = root.querySelector('.pbx-blank b'),
        blankP = root.querySelector('.pbx-blank p'),
        cap    = root.querySelector('.pbx-cap');

    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var cat = null, sIdx = 0, s = 100, box = null, frame = 0, ticket = 0, seen = {};

    function src(p){ return /^(https?:|data:|\/\/)/.test(p) ? p : PBX.base + p; }

    function emit(n, d){
      d = d || {}; d.widget = 'pbx-compare';
      try{ document.dispatchEvent(new CustomEvent('picbear:'+n, {detail:d, bubbles:true})); }catch(e){}
      if(typeof window.pbTrack === 'function'){ try{ window.pbTrack(n, d); }catch(e){} }
    }

    /* ---------------------------------------------------------- the split */
    function flush(){ frame = 0; root.style.setProperty('--s', s.toFixed(2) + '%'); }
    function put(v, glide){
      s = v < 1 ? 1 : (v > 99 ? 99 : v);
      grip.setAttribute('aria-valuenow', Math.round(s));
      root.classList.toggle('pbx-glide', !!glide);
      if(glide) flush();
      else if(!frame) frame = requestAnimationFrame(flush);   /* one write per frame */
    }

    /* sine ease-in-out: eases away slowly, gains a little pace, settles slowly */
    function ease(t){ return .5 - .5 * Math.cos(Math.PI * t); }

    /* ------------------------------------------------------------ the run */
    var run = { live:false, phase:'rest', t0:0, from:96, to:10, sweep:3400, rest:850, idle:0 };

    function loop(now){
      if(!run.live) return;
      if(run.phase === 'rest'){
        if(now - run.t0 >= run.rest){ run.phase = 'sweep'; run.t0 = now; }
      } else {
        var p = (now - run.t0) / run.sweep;
        if(p >= 1){
          put(run.to, false);
          var t = run.from; run.from = run.to; run.to = t;
          run.phase = 'rest'; run.t0 = now;
        } else {
          put(run.from + (run.to - run.from) * ease(p), false);
        }
      }
      requestAnimationFrame(loop);
    }
    function start(){
      if(!PBX.autoplay || calm || run.live || !blank.hidden) return;
      run.live = true;
      run.from = s; run.to = s > 50 ? 10 : 96;
      run.phase = 'sweep'; run.t0 = performance.now();
      requestAnimationFrame(loop);
    }
    function stop(){ run.live = false; clearTimeout(run.idle); }
    function pause(){
      stop();
      if(!PBX.autoplay) return;
      run.idle = setTimeout(start, 2600);
    }

    /* one reveal on load, then hand over */
    function reveal(){
      if(calm){ put(50, true); start(); return; }
      var t0 = performance.now(), from = 100, to = 50, dur = 1150;
      (function sweep(now){
        var p = (now - t0) / dur;
        if(p >= 1){ put(to, false); start(); return; }
        put(from + (to - from) * ease(p), false);
        requestAnimationFrame(sweep);
      })(t0);
    }

    /* -------------------------------------------------------------- drag */
    var holding = false;
    function at(e){
      if(!box) box = stage.getBoundingClientRect();
      put(((e.clientX - box.left) / box.width) * 100, false);
    }
    stage.addEventListener('pointerdown', function(e){
      if(!blank.hidden) return;
      holding = true; box = stage.getBoundingClientRect();
      root.classList.add('pbx-holding', 'pbx-touched');
      stop();
      try{ stage.setPointerCapture(e.pointerId); }catch(err){}
      at(e); e.preventDefault();
    });
    stage.addEventListener('pointermove', function(e){ if(holding) at(e); });
    function release(){
      if(!holding) return;
      holding = false; box = null;
      root.classList.remove('pbx-holding');
      pause();
    }
    stage.addEventListener('pointerup', release);
    stage.addEventListener('pointercancel', release);
    stage.addEventListener('lostpointercapture', release);
    window.addEventListener('resize', function(){ box = null; place(); });

    grip.addEventListener('keydown', function(e){
      var step = e.shiftKey ? 12 : 4, hit = true;
      if(e.key === 'ArrowLeft')       put(s - step, true);
      else if(e.key === 'ArrowRight') put(s + step, true);
      else if(e.key === 'Home')       put(99, true);
      else if(e.key === 'End')        put(1, true);

      if(hit){ e.preventDefault(); root.classList.add('pbx-touched'); stop(); pause(); }

    document.addEventListener('visibilitychange', function(){
      document.hidden ? stop() : start();

      if(seen[u]) return Promise.resolve();
      return new Promise(function(done){
        var i = new Image();
        i.onload = i.onerror = function(){ seen[u] = 1; done(); };
        i.src = u;
      });
    }
    function warm(d){
      if(!d || !d.styles.length) return;
      grab(src(d.original));
      d.styles.forEach(function(x){ grab(src(x.image)); });
    }

    function render(turn){
      var st = cat.styles[sIdx];
      cap.textContent = st && cat.caption ? cat.caption : '';

      if(!st){
        stop();
        blank.hidden = false; veil.hidden = true;
        blankT.textContent = 'No ' + cat.label.toLowerCase() + ' examples yet';
        blankP.textContent = 'PicBear builds these from your own catalog, never from stock. Switch it on and your first set is ready in minutes.';
        return;
      }
      blank.hidden = true;

      var a = src(cat.original), b = src(st.image), mine = ++ticket;
      if(!(seen[a] && seen[b])) veil.hidden = false;
      if(turn) root.classList.add('pbx-turning');

      Promise.all([grab(a), grab(b)]).then(function(){
        if(mine !== ticket) return;
        imgA.src = a;
        imgB.src = b;
        imgB.className = st.whole ? 'pbx-whole' : '';
        veil.hidden = true;
        requestAnimationFrame(function(){ root.classList.remove('pbx-turning'); });
        if(turn){ put(96, true); setTimeout(function(){ put(50, true); start(); }, 260); }
      });
    }

    /* ---------------------------------------------------------- controls */
    function drawCats(){
      cats.innerHTML = '';
      PBX.data.forEach(function(d){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'pbx-cat';
        b.setAttribute('aria-pressed', d.id === cat.id);
        b.innerHTML = glyph(d.icon) + '<span>' + d.label + '</span>';
        b.addEventListener('click', function(){
          if(cat.id === d.id) return;
          cat = d; sIdx = 0;
          drawCats(); drawStyles(); render(true); warm(d);
          b.scrollIntoView({block:'nearest', inline:'nearest', behavior: calm ? 'auto' : 'smooth'});
          emit('category', {category:d.id, label:d.label, hasExamples:!!d.styles.length});
        });
        cats.appendChild(b);
      });
    }

    function place(){
      var on = styles.querySelector('.pbx-style[aria-selected="true"]');
      if(!on){ rule.style.width = '0'; return; }
      rule.style.width = on.offsetWidth + 'px';
      rule.style.transform = 'translateX(' + on.offsetLeft + 'px)';
    }

    function drawStyles(){
      styles.querySelectorAll('.pbx-style').forEach(function(n){ n.remove(); });
      styles.style.display = cat.styles.length ? '' : 'none';
      cat.styles.forEach(function(st, i){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'pbx-style'; b.setAttribute('role','tab');
        b.textContent = st.label; b.setAttribute('aria-selected', i === sIdx);
        b.addEventListener('click', function(){
          if(sIdx === i) return;
          sIdx = i;
          styles.querySelectorAll('.pbx-style').forEach(function(n, j){ n.setAttribute('aria-selected', j === i); });
          place(); render(true);
          emit('style', {category:cat.id, style:st.id});
        });
        styles.appendChild(b);
      });
      requestAnimationFrame(place);
    }

    /* --------------------------------------------------------------- go */
    cat = PBX.data.filter(function(d){ return d.id === PBX.start; })[0] || PBX.data[0];
    drawCats(); drawStyles(); put(100, true); render(false); warm(cat);
    setTimeout(reveal, 260);
    emit('shown', {category:cat.id, autoplay:!!PBX.autoplay});

    window.PBXCompare = {
      init:init, config:PBX, root:root, play:start, halt:stop,
      setCategory:function(id){
        var d = PBX.data.filter(function(x){ return x.id === id; })[0];
        if(d){ cat = d; sIdx = 0; drawCats(); drawStyles(); render(true); warm(d); }
      }
    };
  }

  window.PBXCompare = window.PBXCompare || {};
  window.PBXCompare.init = init;
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', init); }
  else { init(); }
})();
</script>

</div>
<script>
(function(){
  var host=document.getElementById('pbx-host'),last=0;
  function send(){
    var h=Math.ceil(host.getBoundingClientRect().height)+2;
    if(h&&Math.abs(h-last)>1){last=h;try{parent.postMessage({type:'pb-height',height:h},'*');}catch(e){}}
  }
  send();window.addEventListener('load',send);window.addEventListener('resize',send);
  if(window.ResizeObserver)new ResizeObserver(send).observe(host);
  [150,500,1200,2500].forEach(function(t){setTimeout(send,t);});
})();
</script></body></html>
